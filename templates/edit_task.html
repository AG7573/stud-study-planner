{% extends "base.html" %}

{% block content %}
    <form id="edit-task-form" method="post" action="{{ url_for('tasks.edit_tasks', task_id=task.id) }}">
        <label>Title: <input id="title" type="text" name="title" value="{{ task.title }}">       </label>
        <div id="title-error" class="error"></div> 
        <label>Estimated Hours: <input id="estimated_hours" type="number" step="0.5" name="estimated_hours" value="{{ task.estimated_hours }}"></label>
        <div id="estimated_hours-error" class="error"></div> 
        <label>Priority: 
            <select id="priority" name="priority">
                <option value="low" {% if task.priority == "low" %}selected{% endif %}>Low</option>
                <option value="medium" {% if task.priority == "medium" %}selected{% endif %}>Medium</option>
                <option value="high" {% if task.priority == "high" %}selected{% endif %}>High</option>
            </select>
        </label>
        <div id="priority-error" class="error"></div>
        <label>Due Date: <input id="due_date" type="date" name="due_date" value="{{ task.due_date }}"></label>
        <div id="due_date-error" class="error"></div>  
        <label>Status: 
            <select id="status" name="status">
                <option value="pending" {% if task.status == "pending" %}selected{% endif %}>Pending</option>
                <option value="in_progress" {% if task.status == "in_progress" %}selected{% endif %}>In Progress</option>
                <option value="done" {% if task.status == "done" %}selected{% endif %}>Done</option>
            </select>
        </label>
        <div id="status-error" class="error"></div>
        <button type="submit" name="submit">Save</button>
    </form>
    <script>
        const form = document.getElementById("edit-task-form");

        form.addEventListener("submit", function(event) {
            const title = document.getElementById("title");
            const estimated_hours = document.getElementById("estimated_hours");
            const priority = document.getElementById("priority");
            const due_date = document.getElementById("due_date");
            const status = document.getElementById("status");
            let isValid = true;

            document.getElementById("title-error").textContent = "";
            document.getElementById("estimated_hours-error").textContent = "";
            document.getElementById("priority-error").textContent = "";
            document.getElementById("due_date-error").textContent = "";
            document.getElementById("status-error").textContent = "";

            if (!title.value.trim()) {
                document.getElementById("title-error").textContent = "Title is required.";
                isValid = false;
            }

            if (estimated_hours.value === "" || Number(estimated_hours.value) <= 0) {
                document.getElementById("estimated_hours-error").textContent = "Hours cannot be negative.";
                isValid = false;
            }

            if (priority.value === "") {
                document.getElementById("priority-error").textContent = "Select a valid priority level.";
                isValid = false;
            }

            if (!due_date.value) {
                document.getElementById("due_date-error").textContent = "Enter a valid due date.";
                isValid = false;
            }

            if (status.value === "") {
                document.getElementById("status-error").textContent = "Enter a the current status.";
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
            }
        });
    </script>
{% endblock %}
