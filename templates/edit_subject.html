{% extends "base.html" %}

{% block content %}
    <form id="edit-subject-form" method="post" action="{{ url_for('subjects.edit_subject', subject_id=subject.id) }}">
        <label>Name: <input id="name" type="text" name="name" value="{{ subject.name }}"></label>
        <div id="name-error" class="error"></div>
        <label>Exam Date: <input id="exam_date" type="date" name="exam_date" value="{{ subject.exam_date }}"></label>
        <div id="exam_date-error" class="error"></div>
        <button type="submit" name="submit">Submit</button>
    </form>
    <a href="{{ url_for('subjects.list_subjects') }}">Edit</a>
    <script>
        const form = document.getElementById("edit-subject-form");

        form.addEventListener("submit", function(event) {
            const name = document.getElementById("name");
            const exam_date = document.getElementById("exam_date");
            let isValid = true;

            document.getElementById("name-error").textContent = "";
            document.getElementById("exam_date-error").textContent = "";

            if (!name.value.trim()) {
                document.getElementById("name-error").textContent = "Enter a valid subject name.";
                isValid = false;
            }

            if (!exam_date.value) {
                document.getElementById("exam_date-error").textContent = "Enter a valid exam date";
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
            }
        });
    </script>
{% endblock %}
